services:
  # Elasticsearch Service (only starts with: docker compose --profile scraper up)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: linkedin-elasticsearch
    profiles:
      - scraper
    environment:
      # Single-node cluster (for development/small scale)
      - discovery.type=single-node
      # Disable security for simplicity (enable in production!)
      - xpack.security.enabled=false
      # Memory settings (adjust based on your system)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Disable ML features to save resources
      - xpack.ml.enabled=false
      - cluster.name=linkedin-jobs-cluster
      - node.name=linkedin-jobs-node
    ports:
      # Expose Elasticsearch on port 9200
      - "9200:9200"
      - "9300:9300"
    volumes:
      # Persist Elasticsearch data
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - linkedin-scraper-network
    restart: unless-stopped  # Auto-restart on failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # LinkedIn Scraper API Service (only starts with: docker compose --profile scraper up)
  scraper-api:
    build: .
    container_name: linkedin-scraper-api
    profiles:
      - scraper
    ports:
      # Expose API on port 8000
      - "8000:8000"
    volumes:
      # Mount local code for live updates (development)
      - ./api:/app/api
      - ./scrapers:/app/scrapers
      - ./main.py:/app/main.py
      - ./output:/app/output
    environment:
      # Scheduler Configuration
      - AUTO_START_SCHEDULER=True
      - SCHEDULER_DAY=monday
      - SCHEDULER_TIME=09:00
      
      # Job Configuration
      - JOBS_PER_ROLE=20
      - MAX_POST_AGE_DAYS=21
      - EXACT_MATCH=True
      - FETCH_DETAILS=True
      
      # Elasticsearch Configuration
      - ELASTICSEARCH_ENABLED=True
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      - ELASTICSEARCH_INDEX=linkedin_jobs
      
      # Location Priority
      - PRIMARY_LOCATION=Sri Lanka
      - PRIMARY_COUNTRY_CODE=LK
      - FALLBACK_LOCATIONS=United States,India,United Kingdom
      - FALLBACK_COUNTRY_CODES=US,IN,GB
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=False
      
      # Auto-scrape on first startup (runs once if ES index is empty)
      - AUTO_SCRAPE_ON_STARTUP=True
      - AUTO_SCRAPE_MAX_JOBS=5
      
      # Neo4j import (auto-imports scraped jobs into knowledge graph)
      - NEO4J_ENABLED=True
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=tharusha@2001
      
      # API Configuration
      - APP_NAME=LinkedIn Job Scraper API
      - APP_VERSION=2.0.0
      - API_V1_PREFIX=/api/v1
    depends_on:
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - linkedin-scraper-network
    restart: unless-stopped  # Auto-restart on failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Neo4j Graph Database (for Role-Skill API / Knowledge Graph)
  neo4j:
    image: neo4j:5
    container_name: linkedin-neo4j
    environment:
      - NEO4J_AUTH=neo4j/tharusha@2001
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - linkedin-scraper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: linkedin-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - linkedin-scraper-network
    restart: unless-stopped
    profiles:
      - with-kibana  # Only start if explicitly requested

# Named volumes for data persistence
volumes:
  elasticsearch_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

# Network for services to communicate
networks:
  linkedin-scraper-network:
    driver: bridge
